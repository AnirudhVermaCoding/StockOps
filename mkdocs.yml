site_name: StockOps | Multi-Cloud MLOps Portfolio
site_description: Production ML services with FastAPI, Kubernetes, Terraform, monitoring, and multi-cloud deployment.
site_author: Anirudh Verma
site_url: https://anirudhvermacoding.github.io/StockOps/

repo_name: AnirudhVermaCoding/StockOps
repo_url: https://github.com/AnirudhVermaCoding/StockOps

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - header.autohide
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  # Single dark scheme — the editorial design system is one theme by design
  # (Linear/Vercel pattern); colors are overridden in portfolio.css tokens.
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# The ?v= query busts GitHub Pages / browser caches when assets change.
# Bump the date suffix on every visual release.
extra_css:
  - assets/stylesheets/portfolio.css?v=20260706f

extra_javascript:
  - assets/javascripts/site.js?v=20260706f
  - assets/javascripts/neural-field.js?v=20260703h
  - assets/javascripts/neural-scene.js?v=20260703h
  - assets/javascripts/portfolio.js?v=20260703h

plugins:
  - search
  - mermaid2:
      arguments:
        theme: dark
        themeVariables:
          primaryColor: "#0B1120"
          primaryTextColor: "#F8FAFC"
          primaryBorderColor: "#22D3EE"
          lineColor: "#94A3B8"
          fontFamily: "JetBrains Mono, monospace"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
      - BankChurn Predictor: projects/bankchurn.md
      - NLPInsight Analyzer: projects/nlpinsight.md
      - ChicagoTaxi Pipeline: projects/chicagotaxi.md
      - Production Template: template.md
      - agent-local (LLM Plane): agent-local.md
  - Recruiter-Brief: recruiter-brief.md
  - About: about.md
  - Contact: contact.md

extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/AnirudhVermaCoding

watch:
  - docs

copyright: StockOps adaptation &copy; 2026 Anirudh Verma · Original work &copy; 2024-2026 Duque Ortega Mutis
